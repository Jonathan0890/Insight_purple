version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mydb
      JWT_SECRET: supersecret
      ENCRYPTION_KEY: 12345678901234567890123456789012

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
